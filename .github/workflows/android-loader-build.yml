name: Build NewBlackbox SDK + Loader APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-loader-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android NDK 29 is installed
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.13846066"

      - name: Make gradle wrappers executable
        run: |
          chmod +x NewBlackbox/gradlew
          chmod +x Loader/gradlew
          chmod +x scripts/build_loader_with_sdk.sh

      - name: Build SDK and Loader Debug APK
        run: bash scripts/build_loader_with_sdk.sh debug

      - name: Upload Loader debug APK
        uses: actions/upload-artifact@v4
        with:
          name: loader-debug-apk
          path: Loader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Bcore AAR
        uses: actions/upload-artifact@v4
        with:
          name: bcore-release-aar
          path: NewBlackbox/Bcore/build/outputs/aar/Bcore-release.aar
          if-no-files-found: error
